<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotebookLM 2026 — BAO Academy</title>
 <link rel="icon" type="image/x-icon" href="/assets/orange.png">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="sidebar"></div>
<div id="main"></div>

<script>
fetch('/assets/content.html')
  .then((res) => res.text())
  .then((html) => {
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('sidebar')?.remove();
    document.getElementById('main')?.remove();

    const s = document.createElement('script');
    s.src = '/assets/main.js';
    document.body.appendChild(s);
  });
</script>
</body>
</html>
